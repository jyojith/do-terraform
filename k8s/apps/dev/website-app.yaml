# Argo CD Application for the marketing website — manifests live in the bizquery-website-deployment
# repo (CI bumps the image on each build). Replaces the loading-page placeholder at the apex
# (bizquery.dev). The bizquery-website namespace + ghcr-pull secret are Terraform-managed (argocd stack).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jyojith/bizquery-website-deployment.git
    targetRevision: main
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: bizquery-website
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
