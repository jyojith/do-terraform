apiVersion: v1
kind: ConfigMap
metadata:
  name: bizquery-config
  namespace: bizquery
# Non-secret runtime config. Secret values (DB URL, API keys, session/admin secrets) come from the
# `bizquery-secrets` Secret, created out-of-band — see README.md.
data:
  BQP_STORAGE_URL: "file:///data/raw"
  # the agent dials its OWN in-pod MCP server; the MCP DNS-rebinding host-check allows only
  # localhost (a Service name like bizquery-api:8000 triggers a 421 "Invalid Host header")
  BQP_INTERNAL_BASE_URL: "http://localhost:8000"
  BQP_SUPER_ORG_NAME: "BizQuery HQ"
  BQP_ADMIN_EMAIL: "admin@bizquery.dev"

  # --- inference via DigitalOcean Gradient AI (serverless, OpenAI-compatible) ---
  # one base URL for chat + embeddings; auth is a DO "model access key" in bizquery-secrets
  # (BQP_CHAT_API_KEY + OPENAI_API_KEY). Confirm slugs with: GET https://inference.do-ai.run/v1/models
  BQP_CHAT_BASE_URL: "https://inference.do-ai.run/v1"
  BQP_CHAT_MODEL: "openai-gpt-oss-20b" # the one you ran locally; openai-gpt-oss-120b for more quality
  OPENAI_BASE_URL: "https://inference.do-ai.run/v1"
  BQP_EMBED_MODEL: "qwen3-embedding-0.6b" # confirmed available via /v1/models
  BQP_EMBED_DIMENSIONS: "1024"            # Qwen3-Embedding-0.6B native width; <=2000 for pgvector HNSW
  # Qwen3 embeddings are asymmetric — queries get an instruction, documents don't
  BQP_EMBED_QUERY_PREFIX: "Instruct: Given a question, retrieve company documents that answer it\nQuery: "
  BQP_EMBED_DOCUMENT_PREFIX: ""
