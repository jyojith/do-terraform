apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizquery-worker
  namespace: bizquery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bizquery-worker
  template:
    metadata:
      labels:
        app: bizquery-worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z bizquery-postgres 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: worker
          image: ghcr.io/bizquery/bizquery-platform:develop
          args: ["worker"] # same image, runs the procrastinate worker
          env:
            - name: BQP_WORKER_CONCURRENCY
              value: "2" # gentle on a small node (PDF parsing + embeddings are memory-heavy)
          envFrom:
            - configMapRef:
                name: bizquery-config
            - secretRef:
                name: bizquery-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: raw-files
              mountPath: /data/raw
      volumes:
        - name: raw-files
          persistentVolumeClaim:
            claimName: bizquery-raw-files
