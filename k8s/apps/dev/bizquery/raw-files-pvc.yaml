# Shared raw-document storage: the api writes uploaded PDFs here and the worker reads them back.
# ReadWriteOnce is fine while the cluster is a single node (both pods land on it). If you scale to
# multiple nodes, switch the app to object storage (BQP_STORAGE_URL=s3://… via DO Spaces) instead.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bizquery-raw-files
  namespace: bizquery
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 5Gi
